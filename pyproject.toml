[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adlift"
version = "0.1.0"
description = "Reproducible benchmark analysis of advertising incrementality and uplift targeting"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.4,<2", "lightgbm>=4.5,<5", "matplotlib>=3.9,<4",
  "numpy>=2,<3", "pandas>=2.2,<4", "polars>=1.20,<2",
  "pyarrow>=18,<26", "scikit-learn>=1.6,<2", "scipy>=1.14,<2",
]

[dependency-groups]
dev = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/adlift"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
